name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Use declared npm version
        run: npm install --global npm@12.0.2
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Compile Cloudflare Pages Functions
        run: mkdir -p .tmp && npx wrangler pages functions build functions --outfile .tmp/pages-worker.js
      - name: Live FreeTSA + OpenSSL integration
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npm run test:freetsa
      - name: Upload build and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: they-told-me-ci
          path: |
            dist
            package-lock.json
          if-no-files-found: error
